version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: houseturing_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
      - ../db/schema.sql:/tmp/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.15.0
    container_name: houseturing_n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5690:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${PG_USER}
      - DB_POSTGRESDB_PASSWORD=${PG_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Bogota}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - N8N_LOG_LEVEL=info
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=false
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ../workflows:/workflows
    depends_on:
      postgres:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: houseturing_tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    profiles:
      - tunnel

  # URL efímera; el dueño levanta este perfil sobre la instancia existente.
  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    container_name: houseturing_tunnel_quick
    command: tunnel --url http://n8n:5678
    profiles:
      - tunnel-quick
    depends_on:
      - n8n
